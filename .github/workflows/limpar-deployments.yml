# Mantém só o deployment mais recente do ambiente github-pages.
# Roda quando o build do Pages termina (e sob demanda). O deployment mais
# recente nunca é tocado: é o ponteiro ativo do Pages.
name: Limpar deployments antigos

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  deployments: write
  contents: read

concurrency:
  group: limpar-deployments
  cancel-in-progress: false

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - name: Apagar deployments antigos do github-pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # mais recente primeiro; pula o primeiro (ativo) e remove o resto
          ids=$(gh api "repos/$REPO/deployments?environment=github-pages&per_page=100" \
                  --jq 'sort_by(.created_at) | reverse | .[1:] | .[].id')
          if [ -z "$ids" ]; then echo "Nada a limpar."; exit 0; fi
          for id in $ids; do
            echo "Removendo deployment $id"
            gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=inactive >/dev/null
            gh api -X DELETE "repos/$REPO/deployments/$id" >/dev/null
          done
          echo "Restante:"
          gh api "repos/$REPO/deployments?environment=github-pages" --jq '.[] | "\(.id) \(.sha[0:7])"'
